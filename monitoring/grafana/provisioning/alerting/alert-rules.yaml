apiVersion: 1
groups:
  - orgId: 1
    name: AppAlerts
    folder: Alerts
    interval: 1m
    rules:
      - uid: grafana_high_cpu
        title: Host CPU > 70%
        condition: A
        data:
          - refId: A
            datasourceUid: PROMDS
            model:
              editorMode: code
              expr: 100 - (avg by(instance)(irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)
              intervalMs: 60000
              legendFormat: CPU%
              maxDataPoints: 43200
              queryType: timeSeriesQuery
        for: 5m
        annotations:
          summary: CPU del host > 70% por 5m
        labels:
          severity: critical
        isPaused: false

      - uid: grafana_http_p95
        title: HTTP p95 > 1s
        condition: A
        data:
          - refId: A
            datasourceUid: PROMDS
            model:
              editorMode: code
              expr: histogram_quantile(0.95, sum(rate(probe_http_duration_seconds_bucket{job="blackbox-http"}[5m])) by (le, instance))
              intervalMs: 60000
              legendFormat: p95
              maxDataPoints: 43200
              queryType: timeSeriesQuery
        for: 10m
        annotations:
          summary: p95 HTTP > 1s (10m)
        labels:
          severity: critical
        isPaused: false

      - uid: grafana_http_availability
        title: HTTP Availability < 95%
        condition: A
        data:
          - refId: A
            datasourceUid: PROMDS
            model:
              editorMode: code
              expr: avg_over_time(probe_success{job="blackbox-http"}[5m])
              intervalMs: 60000
              legendFormat: success
              maxDataPoints: 43200
              queryType: timeSeriesQuery
        for: 5m
        annotations:
          summary: Disponibilidad HTTP < 95% (5m)
        labels:
          severity: critical
        isPaused: false

      - uid: grafana_backend_memory
        title: Backend Memory > 500MB
        condition: A
        data:
          - refId: A
            datasourceUid: PROMDS
            model:
              editorMode: code
              expr: container_memory_usage_bytes{name=~"app_(dev|uat|prod)"}
              intervalMs: 60000
              legendFormat: mem
              maxDataPoints: 43200
              queryType: timeSeriesQuery
        for: 10m
        annotations:
          summary: Memoria backend > ~600MB (10m)
        labels:
          severity: warning
        isPaused: false

      - uid: grafana_backend_memory_percent
        title: Backend Memory > 15% host
        condition: A
        data:
          - refId: A
            datasourceUid: PROMDS
            model:
              editorMode: code
              expr: 100 * sum(container_memory_usage_bytes{name=~"app_(dev|uat|prod)"}) / sum(node_memory_MemTotal_bytes)
              intervalMs: 60000
              legendFormat: "uso%"
              maxDataPoints: 43200
              queryType: timeSeriesQuery
        for: 5m
        annotations:
          summary: Uso combinado de memoria de backend supera 15% del host (5m)
        labels:
          severity: critical
        isPaused: false


