# Alarmas para métricas del pipeline capturadas vía StatsD

alarm: pipeline_build_tests_duration
on: statsd.jenkins_pipeline_build_tests_duration_ms
calc: $value / 1000
every: 30s
units: s
warn: $this > 180
crit: $this > 300
info: La etapa Build & Tests tomó más de 3 min (warning) o 5 min (crit).

alarm: pipeline_quality_gate_duration
on: statsd.jenkins_pipeline_quality_gate_duration_ms
calc: $value / 1000
every: 30s
units: s
warn: $this > 600
crit: $this > 900
info: La espera del Quality Gate superó lo esperado.

alarm: pipeline_docker_build_duration
on: statsd.jenkins_pipeline_docker_build_duration_ms
calc: $value / 1000
every: 30s
units: s
warn: $this > 240
crit: $this > 420
info: Docker build excedió los tiempos normales.

alarm: pipeline_deploy_duration
on: statsd.jenkins_pipeline_deploy_duration_ms
calc: $value / 1000
every: 30s
units: s
warn: $this > 180
crit: $this > 300
info: Despliegue por rama demoró más de lo esperado.

alarm: pipeline_success_smoke
on: statsd.jenkins_pipeline_alert_probe
calc: $value
every: 10s
units: flag
warn: $this >= 1
crit: $this >= 1
delay: down 20s
info: Alarma de verificación para notificaciones (se dispara en éxitos).

