# Alarmas de desempeño del host

alarm: performance_cpu_high
on: system.cpu
calc: $user + $system + $softirq + $nice + $irq + $guest
every: 30s
units: %
warn: $this > 70
crit: $this > 90
info: Uso combinado de CPU superó el umbral definido.

alarm: performance_ram_high
on: system.ram
calc: 100 * $used / ($used + $free + $cached + $buffers)
every: 30s
units: %
warn: $this > 80
crit: $this > 90
info: Memoria RAM utilizada superior al 80%.

alarm: performance_disk_busy
on: disk.util
lookup: max -5m unaligned of *
every: 30s
units: %
warn: $this > 70
crit: $this > 90
info: Algún disco alcanzó un nivel alto de utilización.

alarm: performance_network_throughput
on: system.net
calc: ($in + $out) / 125000
every: 30s
units: Mbps
warn: $this > 900
crit: $this > 950
info: Tráfico agregado de red superior al ancho de banda esperado.

