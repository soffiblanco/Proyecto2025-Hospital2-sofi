services:
  frontend:
    build:
      context: /home/andrespc/Documents/Proyecto2025  #  Cambiar el contexto a la raíz
      dockerfile: src/Dockerfile  #  Especifica que el Dockerfile está dentro de `src/`
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network


  backend:
    build:
      context: /home/andrespc/Documents/Proyecto2025/backend  #  Backend usa backend/
      dockerfile: Dockerfile.jvm
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:oracle:thin:@db:1521/XEPDB1
      - QUARKUS_DATASOURCE_USERNAME=C##PROYECTO
      - QUARKUS_DATASOURCE_PASSWORD=Unis
    depends_on:
      - db
    networks:
      - app-network

  db:
    image: container-registry.oracle.com/database/express:latest
    environment:
      - ORACLE_PASSWORD=Unis
    ports:
      - "1521:1521"
    networks:
      - app-network

  sonar_db:
    image: postgres:12
    container_name: sonar_db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar_db_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  sonarqube:
    image: sonarqube:9.9.5-community
    container_name: sonarqube
    depends_on:
      - sonar_db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  sonar_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

